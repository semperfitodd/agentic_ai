name: Frontend

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'static_site/**'
      - '.github/workflows/frontend.yml'
  push:
    branches:
      - main
    paths:
      - 'static_site/**'
      - '.github/workflows/frontend.yml'

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: static_site

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: static_site/package-lock.json

      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_COGNITO_AUTHORITY: ${{ vars.COGNITO_AUTHORITY }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
          VITE_COGNITO_DOMAIN: ${{ vars.COGNITO_DOMAIN }}
          REQUIRE_CONFIG: ${{ github.event_name != 'pull_request' }}
        run: |
          for name in VITE_API_URL VITE_COGNITO_AUTHORITY VITE_COGNITO_CLIENT_ID VITE_COGNITO_DOMAIN; do
            if [ "$REQUIRE_CONFIG" = "true" ] && [ -z "${!name}" ]; then
              echo "::error::Missing GitHub variable for $name (see README)."
              exit 1
            fi
          done
          npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: static_site/dist/
          retention-days: 1

  deploy:
    name: Deploy to S3
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: frontend-deploy
      cancel-in-progress: false

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: static_site/dist/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync hashed assets (long cache)
        run: |
          aws s3 sync static_site/dist/assets "s3://${{ vars.SITE_BUCKET }}/assets" \
            --delete --only-show-errors \
            --cache-control "public,max-age=31536000,immutable"

      - name: Sync entry points (no cache)
        run: |
          aws s3 sync static_site/dist/ "s3://${{ vars.SITE_BUCKET }}/" \
            --delete --only-show-errors \
            --exclude "assets/*" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
