<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F7F8FB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A0D14" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>Arc Agent: AI Sprint Reports from GitHub Pull Requests</title>
    <meta name="description" content="Agentic AI that analyzes every merged GitHub pull request with Amazon Nova on Bedrock and writes an executive-ready sprint report with metrics, risks, and next steps." />
    <meta name="author" content="Todd Bernson" />
    <!--seo-->
    <script>
      try {
        var theme = localStorage.getItem('arc_theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>Arc Agent needs JavaScript to sign in and run analyses.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
